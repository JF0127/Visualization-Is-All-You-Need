[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p025-visual-monitor"
version = "0.3.0"
description = "用 module.md 描述模块与数据流，并在本地实时监测项目状态"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
p025-viewer = "viewer.server:main"

[tool.setuptools]
packages = ["probe", "viewer"]

[tool.setuptools.package-data]
viewer = ["*.html", "*.css", "*.js", "*.mjs"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
