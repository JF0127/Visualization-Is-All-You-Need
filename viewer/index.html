<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>模块与数据流</title>
  <style>
    :root {
      color-scheme: light;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --bg: #f7f7f4;
      --chrome: #fbfbf9;
      --surface: #ffffff;
      --frame-fill: #fcfcfa;
      --ink: #1c2026;
      --ink-2: #545b65;
      --ink-3: #8a9099;
      --ink-4: #b8bbbf;
      --line: #e5e5df;
      --line-strong: #d3d4cd;
      --frame: #b3b5ae;
      --edge: #b2b5b9;
      --edge-active: #4f5660;
      --ext-fill: #ebebe6;
      --ext-ink: #6a7079;
      --ok: #4a9a6e;
      --warn: #a3631d;
      --warn-soft: #f5e9d8;
      --ease: cubic-bezier(.2, .7, .2, 1);
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
      background: var(--bg); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    [hidden] { display: none !important; }

    /* 顶栏 */
    .topbar {
      flex: none; display: flex; align-items: center; justify-content: space-between; gap: 20px;
      min-height: 48px; padding: 6px 16px 6px 12px; background: var(--chrome); border-bottom: 1px solid var(--line);
    }
    .breadcrumbs { display: flex; align-items: center; gap: 1px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
    .crumb {
      display: inline-flex; align-items: center; gap: 9px; min-width: 0; max-width: 260px; padding: 5px 8px;
      border: 0; border-radius: 6px; background: transparent; font-size: 13.5px; color: var(--ink-2);
      white-space: nowrap; transition: background .15s, color .15s;
    }
    .crumb-text { overflow: hidden; text-overflow: ellipsis; }
    .crumb:hover:not(:disabled) { background: #ededE8; color: var(--ink); }
    .crumb:disabled { cursor: default; color: var(--ink); font-weight: 600; }
    .crumb-root { flex: none; font-size: 14.5px; font-weight: 650; color: var(--ink); letter-spacing: .01em; }
    .crumb-sep { flex: none; padding: 0 2px; color: var(--ink-4); font-size: 13px; }
    .brand { width: 18px; height: 18px; flex: none; }
    .topbar-right { display: flex; align-items: center; gap: 14px; flex: none; }
    .filters { display: flex; gap: 2px; margin: 0; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: #efefea; }
    .filters legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .chip { position: relative; display: block; cursor: pointer; }
    .chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .chip span {
      display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 9px; border-radius: 6px;
      font-size: 12.5px; color: var(--ink-3); transition: background .16s, color .16s, box-shadow .16s;
    }
    .chip span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.2px solid currentColor; box-sizing: border-box; transition: background .16s, border-color .16s; }
    .chip:hover input:not(:checked) + span { color: var(--ink-2); }
    .chip input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(28, 32, 38, .06); }
    .chip input:checked + span::before { background: var(--ink); border-color: var(--ink); }
    .chip input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 1px; }
    .status { display: inline-flex; align-items: center; gap: 8px; max-width: 300px; height: 20px; padding-left: 14px; border-left: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
    .status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--ink-4); transition: background .3s; }
    .status.ok .status-dot { background: var(--ok); }
    .status.pending .status-dot { animation: breathe 1.4s ease-in-out infinite; }
    .status.warning { color: var(--warn); }
    .status.warning .status-dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }

    /* 画布 */
    .canvas { position: relative; flex: 1 1 auto; min-height: 240px; overflow: hidden; background: var(--bg); }
    .graph { position: absolute; inset: 0; display: flex; overflow: auto; padding: 24px 28px; }
    .graph-wrap { flex: none; margin: auto; }
    .graph-svg { display: block; width: 100%; height: 100%; overflow: visible; font-family: var(--font); }
    .empty { margin: auto; max-width: 440px; text-align: center; color: var(--ink-3); font-size: 13.5px; line-height: 1.9; }
    .morph { position: absolute; z-index: 4; pointer-events: none; border: 1px dashed var(--frame); border-radius: 9px; background: rgba(252, 252, 250, .7); }

    .frame-box { fill: var(--frame-fill); stroke: var(--frame); stroke-width: 1; stroke-dasharray: 5 4; }
    .frame-name { fill: var(--ink); font-size: 13.5px; font-weight: 600; }
    .frame-id { fill: var(--ink-3); font-family: var(--mono); font-size: 11px; }

    .node { cursor: pointer; outline: none; transition: opacity .2s ease; }
    .node-box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; filter: url(#node-shadow); transition: stroke .15s, stroke-width .15s, fill .15s; }
    .node-stack { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; transition: transform .22s var(--ease); }
    .node-name { fill: var(--ink); font-size: 14px; font-weight: 600; }
    .node-summary { fill: var(--ink-2); font-size: 12px; }
    .node-chevron { fill: none; stroke: var(--ink-3); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s var(--ease), stroke .15s; }
    .node:hover .node-box { stroke: #a6a9a4; }
    .node:hover .node-stack { transform: translate(2px, 2px); }
    .node:hover .node-chevron { transform: translateX(2px); stroke: var(--ink); }
    .node.open .node-box { stroke: var(--ink); stroke-width: 1.5; }
    .node:focus-visible .node-box { stroke: var(--ink); stroke-width: 2; }
    .node.external .node-box { fill: var(--ext-fill); stroke: var(--ext-fill); filter: none; }
    .node.external .node-name { fill: var(--ext-ink); font-weight: 500; }
    .node.external .node-summary { fill: #9ca1a7; }
    .node.external .node-chevron { opacity: 0; transition: opacity .15s, transform .22s var(--ease); }
    .node.external:hover .node-box { fill: #e3e3dd; stroke: #d6d7d0; }
    .node.external:hover .node-chevron { opacity: 1; stroke: var(--ext-ink); }

    .edge { cursor: pointer; outline: none; transition: opacity .2s ease; }
    .edge-line { fill: none; stroke: var(--edge); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s ease, stroke-width .15s; }
    .edge-motion { fill: none; stroke: #fff; stroke-opacity: 0; stroke-width: 1; stroke-dasharray: 4 16; stroke-linecap: round; pointer-events: none; transition: stroke-opacity .3s; }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
    .edge-label-hit { fill: transparent; pointer-events: all; }
    .edge-label { fill: var(--ink-3); font-size: 11.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; transition: fill .25s; }
    .edge-label.on-frame { stroke: var(--frame-fill); }
    .edge-dot { stroke: #fff; stroke-width: 1.6; pointer-events: none; }
    .edge.active .edge-line { stroke: var(--edge-active); stroke-width: 1.5; }
    .edge.active .edge-motion { stroke-opacity: .9; animation: flow 1.2s linear infinite; }
    .edge.active .edge-label { fill: var(--ink-2); }
    .edge.observed .edge-line { stroke-width: 2.1; }
    .edge.observed .edge-label, .edge.hover .edge-label, .edge.menu-open .edge-label { fill: var(--ink); }
    .edge.hover .edge-line, .edge.menu-open .edge-line, .edge:focus-visible .edge-line { stroke-width: 2; }
    .edge.observed.hover .edge-line, .edge.observed.menu-open .edge-line { stroke-width: 2.6; }
    .edge.hover:not(.observed):not(.active) .edge-line, .edge.menu-open:not(.observed):not(.active) .edge-line { stroke: #7b8189; }
    .graph-svg.focusing .edge:not(.related) { opacity: .2; }
    .graph-svg.focusing .node:not(.related) { opacity: .45; }

    .graph-svg.enter-in { animation: enter-in .34s var(--ease) .16s backwards; }
    .graph-svg.enter-out { animation: enter-out .34s var(--ease) .1s backwards; }
    .graph-svg.enter-fade { animation: fade-in .26s ease backwards; }
    @keyframes enter-in { from { opacity: 0; transform: scale(.975); } }
    @keyframes enter-out { from { opacity: 0; transform: scale(1.025); } }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes pop { from { opacity: 0; transform: translateY(3px) scale(.985); } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes breathe { 50% { opacity: .35; } }

    /* 浮层：模块说明与观测菜单 */
    .popover {
      position: absolute; z-index: 10; width: 304px; max-width: calc(100% - 20px); max-height: calc(100% - 20px); overflow-y: auto;
      padding: 14px 16px 16px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
      box-shadow: 0 8px 24px rgba(28, 32, 38, .07), 0 1px 2px rgba(28, 32, 38, .05);
      animation: pop .16s var(--ease); overflow-wrap: anywhere;
    }
    .pop-name { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.45; }
    .pop-id { display: inline-block; margin-top: 4px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
    .pop-summary { margin: 10px 0 0; font-size: 13px; line-height: 1.75; color: var(--ink); }
    .pop-label { margin: 14px 0 5px; font-size: 11px; letter-spacing: .14em; color: var(--ink-3); }
    .pop-detail { margin: 0; font-size: 12.5px; line-height: 1.85; color: var(--ink-2); white-space: pre-wrap; }
    .popover.menu { width: 300px; padding: 10px 6px 6px; }
    .menu-head { padding: 0 10px 8px; font-size: 11.5px; color: var(--ink-3); border-bottom: 1px solid var(--line); }
    .menu-head strong { color: var(--ink-2); font-weight: 600; }
    .menu-list { padding-top: 4px; }
    .menu-row { position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: background .12s; }
    .menu-row:hover { background: #f4f4f0; }
    .menu-row input { position: absolute; opacity: 0; pointer-events: none; }
    .menu-box { flex: none; width: 14px; height: 14px; margin-top: 2px; border: 1.3px solid var(--ink-4); border-radius: 3.5px; background: var(--surface); transition: background .15s, border-color .15s; display: grid; place-items: center; }
    .menu-box svg { opacity: 0; }
    .menu-row input:checked + .menu-box { background: var(--c); border-color: var(--c); }
    .menu-row input:checked + .menu-box svg { opacity: 1; }
    .menu-row input:focus-visible + .menu-box { outline: 2px solid var(--ink); outline-offset: 2px; }
    .menu-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .menu-label { font-size: 13px; line-height: 1.5; color: var(--ink); }
    .menu-sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }

    /* 观测区 */
    .observe { flex: none; max-height: 46vh; overflow-y: auto; border-top: 1px solid var(--line); background: var(--chrome); }
    .observe-hint { display: flex; align-items: center; gap: 10px; margin: 0; padding: 12px 20px; font-size: 12.5px; color: var(--ink-3); }
    .observe-hint::before { content: ""; width: 18px; border-top: 1.5px solid var(--edge); }
    .observe.empty .observe-head, .observe.empty .cards { display: none; }
    .observe:not(.empty) .observe-hint { display: none; }
    .observe-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 14px 0 20px; background: var(--chrome); }
    .observe-title { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--ink-2); }
    .observe-sub { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .pause-note { font-family: var(--mono); font-size: 11.5px; color: var(--warn); }
    .pause {
      margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px;
      border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-size: 12px; color: var(--ink-2);
      transition: background .15s, color .15s, border-color .15s;
    }
    .pause:hover { border-color: #b9bbb5; color: var(--ink); }
    .pause.paused { background: var(--ink); border-color: var(--ink); color: #fff; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; padding: 0 16px 16px; }
    .card { min-width: 0; padding: 12px 14px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; animation: rise .28s var(--ease) backwards; }
    .card-head { display: flex; align-items: flex-start; gap: 9px; }
    .card-dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--c); }
    .card-title { flex: 1; min-width: 0; margin: 0; font-size: 13px; font-weight: 600; line-height: 1.55; overflow-wrap: anywhere; }
    .card-route { font-weight: 400; color: var(--ink-3); }
    .card-remove { flex: none; display: grid; place-items: center; width: 22px; height: 22px; margin: -1px -4px 0 0; border: 0; border-radius: 5px; background: transparent; color: var(--ink-3); transition: background .15s, color .15s; }
    .card-remove:hover { background: #f0f0ec; color: var(--ink); }
    .card-meta { margin: 1px 0 0 17px; font-size: 11px; color: var(--ink-3); }
    .card-meta code { font-family: var(--mono); }
    .card-empty { display: flex; align-items: center; justify-content: center; gap: 8px; height: 72px; font-size: 12px; color: var(--ink-3); }
    .card-empty::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-4); animation: breathe 1.6s ease-in-out infinite; }
    .readout { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 10px 0 6px; min-height: 30px; }
    .readout-values { flex: 1; min-width: 0; }
    .readout-value { font-family: var(--mono); font-size: 22px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; }
    .readout-time { flex: none; padding-top: 4px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .hovering .readout-time { color: var(--ink); }
    .channels { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 1px 16px; }
    .channel { display: flex; align-items: center; gap: 7px; min-width: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .channel i { flex: none; width: 10px; height: 2.5px; border-radius: 2px; }
    .channel-index { font-size: 10.5px; color: var(--ink-3); }
    .channel-value { margin-left: auto; font-size: 13.5px; color: var(--ink); white-space: nowrap; }
    .chart { display: block; width: 100%; height: 120px; cursor: crosshair; touch-action: none; }
    .number-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 4px; }
    .number-value { min-width: 0; font-family: var(--mono); font-size: 30px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; white-space: pre-wrap; }
    .number-value.raw { font-size: 12.5px; font-weight: 400; line-height: 1.75; letter-spacing: 0; color: var(--ink-2); }
    .spark { display: block; width: 100%; height: 38px; margin-top: 2px; cursor: crosshair; touch-action: none; }
    .entries { list-style: none; margin: 8px 0 0; padding: 0; }
    .entry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 5px 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.65; }
    .entry + .entry { border-top: 1px solid #f0f0eb; }
    .entry time { color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .entry-value { color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
    .entry:first-child .entry-value { color: var(--ink); }

    @media (max-width: 760px) {
      .topbar { flex-wrap: wrap; gap: 6px 12px; padding: 6px 12px; }
      .topbar-right { width: 100%; justify-content: space-between; }
      .status { border-left: 0; padding-left: 0; max-width: 55vw; }
      .graph { padding: 16px; }
      .cards { grid-template-columns: minmax(0, 1fr); padding: 0 12px 12px; }
      .observe-head { padding: 0 12px 0 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="模块层级"></nav>
    <div class="topbar-right">
      <fieldset class="filters">
        <legend>显示的数据流类型</legend>
        <label class="chip"><input type="checkbox" value="实时" checked><span>实时</span></label>
        <label class="chip"><input type="checkbox" value="配置"><span>配置</span></label>
        <label class="chip"><input type="checkbox" value="文件"><span>文件</span></label>
      </fieldset>
      <div id="status" class="status pending" role="status"><i class="status-dot" aria-hidden="true"></i><span id="status-text" class="status-text">正在连接本地服务…</span></div>
    </div>
  </header>
  <section id="canvas" class="canvas" aria-label="模块关系图">
    <div id="graph" class="graph"></div>
    <div id="popover" class="popover" hidden></div>
  </section>
  <section id="observe" class="observe empty" aria-label="观测区">
    <p class="observe-hint">点击箭头选择要观测的数据</p>
    <div class="observe-head">
      <h2 class="observe-title">观测</h2>
      <span id="observe-count" class="observe-sub"></span>
      <span class="observe-sub">最近 10 秒</span>
      <span id="pause-note" class="pause-note"></span>
      <button id="pause" class="pause" type="button"></button>
    </div>
    <div id="cards" class="cards"></div>
  </section>
  <script>
    "use strict";

    const SVG_NS = "http://www.w3.org/2000/svg";
    const FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif';
    const MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace';
    const NODE_H = 62, ROW_GAP = 52, PAD_X = 52, PAD_Y = 28;
    const FRAME_PAD_X = 64, FRAME_TITLE_H = 48, FRAME_PAD_BOTTOM = 26;
    const NAME_SIZE = 14, NAME_WEIGHT = 600, SUMMARY_SIZE = 12;
    const LABEL_SIZE = 11.5, LABEL_LINE = 15, LABEL_WRAP = 140, LABEL_GAP = 8;
    const MIN_SCALE = .5, MAX_SCALE = 1.35;
    const LIVE_SECONDS = 10, ACTIVE_SECONDS = 2, CHART_LEFT = 48;
    const EDGE_COLORS = { muted: "#b2b5b9", active: "#4f5660", hover: "#7b8189" };
    // 柔和、彼此区分度高的观测色。
    const PALETTE = ["#4e79a7", "#e0813a", "#59a14f", "#b0679f", "#d35f5f", "#3f9a96", "#c09a2e", "#8669bd"];

    const canvas = document.getElementById("canvas");
    const graph = document.getElementById("graph");
    const popover = document.getElementById("popover");
    const observeEl = document.getElementById("observe");
    const cardsEl = document.getElementById("cards");
    const pauseButton = document.getElementById("pause");
    const measureContext = document.createElement("canvas").getContext("2d");
    const state = {
      model: { title: "模块与数据流", modules: new Map(), children: new Map(), flows: [] },
      level: "", types: new Set(["实时"]), text: null, names: new Map(),
      view: null, svg: null, wrap: null, markers: null, edgeElements: [], nodeElements: new Map(),
      observed: new Map(), paused: false, frozen: null, hoverOffset: null, popover: null,
      moduleError: "", namesError: "", namesLoaded: false,
      modulePending: false, namesPending: false
    };
    const live = { cache: new Map(), lastTs: new Map(), since: null, namesKey: "", controller: null };
    const cards = new Map();
    let cardFrame = 0;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function svgElement(tag, attributes = {}, text) {
      const node = document.createElementNS(SVG_NS, tag);
      for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function icon(path, size = 14) {
      const svg = svgElement("svg", { width: size, height: size, viewBox: "0 0 14 14", "aria-hidden": "true" });
      svg.append(svgElement("path", { d: path, fill: "none", stroke: "currentColor", "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round" }));
      return svg;
    }

    function parentId(id) {
      const slash = id.lastIndexOf("/");
      return slash < 0 ? "" : id.slice(0, slash);
    }

    function childToward(base, target) {
      const rest = base ? target.slice(base.length + 1) : target;
      return (base ? base + "/" : "") + rest.split("/")[0];
    }

    function parseMarkdown(text) {
      const modules = new Map(), children = new Map(), flows = [];
      let title = "模块与数据流", current = null;
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        const projectMatch = line.match(/^#\s+(.+)$/);
        const moduleMatch = line.match(/^###\s+([^\s·]+)\s*·\s*(.+)$/);
        if (projectMatch) title = projectMatch[1].trim();
        if (moduleMatch) {
          current = { id: moduleMatch[1], name: moduleMatch[2].trim(), summary: "", detail: "", order: modules.size };
          modules.set(current.id, current);
          continue;
        }
        const flowMatch = line.match(/^-\s+(\S+)\s*->\s*(\S+)\s*:\s*([^|]+)\|([^|]*)\|([^|]*)\|([^|]*)\|(.*)$/);
        if (flowMatch) {
          const [, source, target, name, label, display, type, detail] = flowMatch;
          flows.push({ source, target, name: name.trim(), label: label.trim(), display: display.trim(), type: type.trim(), detail: detail.trim() });
          continue;
        }
        if (/^#{1,6}\s/.test(line)) current = null;
        if (current && /^概要[：:]/.test(line)) current.summary = line.replace(/^概要[：:]\s*/, "");
        if (current && /^详细[：:]/.test(line)) current.detail = line.replace(/^详细[：:]\s*/, "");
      }
      for (const module of modules.values()) {
        const parent = parentId(module.id);
        if (!children.has(parent)) children.set(parent, []);
        children.get(parent).push(module.id);
      }
      return { title, modules, children, flows };
    }

    function hasChildren(id) {
      return (state.model.children.get(id) || []).length > 0;
    }

    function moduleName(id) {
      return state.model.modules.get(id)?.name || id;
    }

    function flowInfo(name) {
      return state.model.flows.find(flow => flow.name === name) || null;
    }

    /* ---------- 面包屑 ---------- */

    function brandMark() {
      const svg = svgElement("svg", { class: "brand", viewBox: "0 0 18 18", "aria-hidden": "true" });
      svg.append(
        svgElement("rect", { x: 1.5, y: 1.5, width: 15, height: 15, rx: 3, fill: "none", stroke: "#b3b5ae", "stroke-width": 1, "stroke-dasharray": "2.5 2" }),
        svgElement("rect", { x: 4, y: 6.5, width: 4, height: 5, rx: 1, fill: "#1c2026" }),
        svgElement("rect", { x: 10, y: 6.5, width: 4, height: 5, rx: 1, fill: "none", stroke: "#1c2026", "stroke-width": 1.1 }),
        svgElement("path", { d: "M 8 9 H 10", stroke: "#1c2026", "stroke-width": 1.1 })
      );
      return svg;
    }

    function renderBreadcrumbs() {
      const nav = document.getElementById("breadcrumbs");
      nav.replaceChildren();
      const entries = [{ id: "", name: state.model.title, root: true }];
      if (state.level) {
        const segments = state.level.split("/");
        segments.forEach((_, index) => {
          const id = segments.slice(0, index + 1).join("/");
          entries.push({ id, name: moduleName(id) });
        });
      }
      entries.forEach((entry, index) => {
        if (index) nav.append(element("span", "crumb-sep", "/"));
        const button = element("button", entry.root ? "crumb crumb-root" : "crumb");
        if (entry.root) {
          button.append(brandMark());
          button.title = "返回顶层";
        }
        button.append(element("span", "crumb-text", entry.name));
        button.type = "button";
        button.disabled = entry.id === state.level;
        if (button.disabled) button.setAttribute("aria-current", "page");
        button.addEventListener("click", () => navigate(entry.id));
        nav.append(button);
      });
    }

    /* ---------- 视图与布局 ---------- */

    function buildView() {
      const visibleIds = state.model.children.get(state.level) || [];
      const visible = new Set(visibleIds);
      const nodes = new Map();
      visibleIds.forEach(id => nodes.set(id, { id, module: state.model.modules.get(id), external: false }));

      function mapEndpoint(id) {
        if (!state.model.modules.has(id)) return null;
        if (!state.level) {
          const top = id.split("/")[0];
          return visible.has(top) ? { id: top, external: false } : null;
        }
        const prefix = state.level + "/";
        if (id.startsWith(prefix)) {
          const child = prefix + id.slice(prefix.length).split("/")[0];
          return visible.has(child) ? { id: child, external: false } : null;
        }
        // 外部端点折叠到与当前路径分叉处的祖先模块，避免展开整个外部子树。
        const outside = id.split("/"), inside = state.level.split("/");
        let common = 0;
        while (common < outside.length && common < inside.length && outside[common] === inside[common]) common++;
        let representative = outside.slice(0, Math.min(common + 1, outside.length)).join("/");
        while (representative && !state.model.modules.has(representative)) representative = parentId(representative);
        return representative ? { id: representative, external: true } : null;
      }

      const groups = new Map();
      for (const flow of state.model.flows) {
        if (!state.types.has(flow.type)) continue;
        const source = mapEndpoint(flow.source), target = mapEndpoint(flow.target);
        if (!source || !target || source.id === target.id || (source.external && target.external)) continue;
        for (const endpoint of [source, target]) {
          if (!nodes.has(endpoint.id)) nodes.set(endpoint.id, { ...endpoint, module: state.model.modules.get(endpoint.id) });
        }
        const key = JSON.stringify([source.id, target.id]);
        if (!groups.has(key)) groups.set(key, { key, source: source.id, target: target.id, flows: [] });
        groups.get(key).flows.push(flow);
      }
      const edges = [...groups.values()];
      edges.forEach(edge => { edge.names = [...new Set(edge.flows.map(flow => flow.name))]; });
      for (const node of nodes.values()) {
        if (!node.external) continue;
        const sends = edges.filter(edge => edge.source === node.id).reduce((sum, edge) => sum + edge.flows.length, 0);
        const receives = edges.filter(edge => edge.target === node.id).reduce((sum, edge) => sum + edge.flows.length, 0);
        node.side = sends >= receives ? "left" : "right";
      }
      return { nodes, edges, visibleIds };
    }

    function textWidth(text, size = 12, weight = 400) {
      if (!measureContext) return Array.from(text).length * size;
      measureContext.font = `${weight} ${size}px ${FONT}`;
      return measureContext.measureText(text).width;
    }

    function truncate(text, width, size = 12, weight = 400) {
      if (textWidth(text, size, weight) <= width) return text;
      const chars = Array.from(text);
      while (chars.length && textWidth(chars.join("") + "…", size, weight) > width) chars.pop();
      return chars.join("").trimEnd() + "…";
    }

    const WIDE = "⺀-鿿豈-﫿︰-﹏＀-￯　-〿";
    const TOKEN = new RegExp(`[${WIDE}]|\\s+|[^\\s${WIDE}]+`, "g");
    const CLOSING = /^[，。、；：！？）》」』】”’,.;:!?)\]]$/;

    // 中文逐字换行、西文按词换行，句读标点不放在行首。
    function wrapText(text, width, size = 12, weight = 400) {
      const lines = [];
      let line = "";
      const fits = value => textWidth(value, size, weight) <= width;
      for (const token of String(text).match(TOKEN) || []) {
        if (/^\s+$/.test(token)) { if (line) line += " "; continue; }
        if (fits(line + token)) { line += token; continue; }
        if (line && CLOSING.test(token)) { line += token; continue; }
        if (line.trim()) { lines.push(line.trimEnd()); line = ""; }
        if (fits(token)) { line = token; continue; }
        for (const char of Array.from(token)) {
          if (line && !fits(line + char)) { lines.push(line); line = ""; }
          line += char;
        }
      }
      if (line.trim() || !lines.length) lines.push(line.trimEnd());
      return lines;
    }

    function layout(view) {
      const internalEdges = view.edges.filter(edge => !view.nodes.get(edge.source).external && !view.nodes.get(edge.target).external);
      const remaining = new Set(view.visibleIds), order = [];
      // 先取没有前驱的模块；遇到环时优先保留向外流动较多的方向。
      while (remaining.size) {
        const candidates = [...remaining].map(id => ({
          id,
          incoming: internalEdges.filter(edge => edge.target === id && remaining.has(edge.source)).reduce((n, edge) => n + edge.flows.length, 0),
          outgoing: internalEdges.filter(edge => edge.source === id && remaining.has(edge.target)).reduce((n, edge) => n + edge.flows.length, 0)
        }));
        const source = candidates.find(item => item.incoming === 0);
        const chosen = source || candidates.reduce((best, item) => item.outgoing - item.incoming > best.outgoing - best.incoming ? item : best);
        order.push(chosen.id);
        remaining.delete(chosen.id);
      }
      const ranks = new Map();
      let previousRank = 0;
      for (const id of order) {
        let rank = previousRank;
        for (const edge of internalEdges) {
          if (edge.target === id && ranks.has(edge.source)) rank = Math.max(rank, ranks.get(edge.source) + 1);
        }
        ranks.set(id, rank);
        previousRank = rank;
      }
      const columns = new Map();
      for (const node of view.nodes.values()) {
        const rank = node.external ? (node.side === "left" ? -1 : previousRank + 1) : ranks.get(node.id);
        if (!columns.has(rank)) columns.set(rank, []);
        columns.get(rank).push(node);
      }
      const layers = [...columns.entries()].sort((a, b) => a[0] - b[0]).map(entry => entry[1]);
      layers.forEach((nodes, col) => nodes.forEach(node => { node.col = col; }));
      // 用相邻模块的纵向位置排序，减少正向连接的交错。
      for (let pass = 0; pass < 4; pass++) {
        const sweep = pass % 2 ? [...layers].reverse() : layers;
        for (const nodes of sweep) {
          const positions = new Map();
          layers.forEach(layer => layer.forEach((node, i) => positions.set(node.id, (i + .5) / layer.length)));
          const score = node => {
            const neighbors = view.edges.flatMap(edge => edge.source === node.id ? [edge.target] : edge.target === node.id ? [edge.source] : []);
            return neighbors.length ? neighbors.reduce((sum, id) => sum + positions.get(id), 0) / neighbors.length : positions.get(node.id);
          };
          const scores = new Map(nodes.map(node => [node.id, score(node)]));
          nodes.sort((a, b) => scores.get(a.id) - scores.get(b.id) || a.module.order - b.module.order);
        }
      }

      // 块宽取能让名称与一行概要都完整显示的最小值，超出上限时截断。
      const framed = !!state.level;
      const nodeList = [...view.nodes.values()];
      nodeList.forEach(node => { node.children = node.external ? 0 : (state.model.children.get(node.id) || []).length; });
      const room = (node, width) => width - 32 - (node.children || node.external ? 22 : 0);
      let nodeW = 276;
      for (let width = 168; width <= 276; width += 4) {
        if (nodeList.every(node => textWidth(node.module.name, NAME_SIZE, NAME_WEIGHT) <= room(node, width) && textWidth(node.module.summary || "", SUMMARY_SIZE) <= room(node, width))) {
          nodeW = width;
          break;
        }
      }
      nodeList.forEach(node => {
        node.nameText = truncate(node.module.name, room(node, nodeW), NAME_SIZE, NAME_WEIGHT);
        node.summaryText = truncate(node.module.summary || "", room(node, nodeW), SUMMARY_SIZE);
      });

      for (const edge of view.edges) {
        const labels = edge.flows.map(flow => flow.label || flow.name);
        edge.label = labels.length > 2 ? labels.slice(0, 2).join("、") + ` 等 ${labels.length} 条` : labels.join("、");
        edge.labelLines = wrapText(edge.label, LABEL_WRAP, LABEL_SIZE);
        edge.labelWidth = Math.max(12, ...edge.labelLines.map(line => textWidth(line, LABEL_SIZE)));
        edge.labelHeight = edge.labelLines.length * LABEL_LINE;
        const distance = view.nodes.get(edge.target).col - view.nodes.get(edge.source).col;
        edge.route = distance <= 0 ? "feedback" : distance > 1 ? "upper" : "forward";
      }
      const maxLabelWidth = Math.max(40, ...view.edges.map(edge => edge.labelWidth));
      const maxLabelHeight = Math.max(LABEL_LINE, ...view.edges.map(edge => edge.labelHeight));
      const gap = Math.max(140, Math.min(220, maxLabelWidth + 72));
      const outGap = Math.max(132, maxLabelWidth + 56);
      const laneStep = maxLabelHeight + LABEL_GAP + 14;
      const span = edge => Math.abs(view.nodes.get(edge.target).col - view.nodes.get(edge.source).col);
      const byLane = (a, b) => span(a) - span(b) || view.nodes.get(a.source).col - view.nodes.get(b.source).col;
      // 跨度短的绕行线贴近模块，跨度长的在外侧，嵌套而不交叉。
      const upper = view.edges.filter(edge => edge.route === "upper").sort(byLane);
      const feedback = view.edges.filter(edge => edge.route === "feedback").sort(byLane);
      upper.forEach((edge, i) => { edge.lane = i; });
      feedback.forEach((edge, i) => { edge.lane = i; });

      // 横向：左侧外部块 | 虚线框（内边距 + 子模块各列）| 右侧外部块。
      const kind = layer => layer[0].external ? layer[0].side : "inner";
      let x = PAD_X, previous = null, frameLeft = null, frameRight = null;
      for (const layer of layers) {
        const current = kind(layer);
        if (previous === null) {
          if (current === "inner" && framed) { frameLeft = x; x += FRAME_PAD_X; }
        } else if (current === "inner" && previous === "inner") {
          x += gap;
        } else if (current === "inner") {
          x += outGap;
          frameLeft = x;
          x += FRAME_PAD_X;
        } else {
          frameRight = x + FRAME_PAD_X;
          x = frameRight + outGap;
        }
        layer.forEach(node => { node.x = x; });
        x += nodeW;
        previous = current;
      }
      if (framed && frameRight === null) { frameRight = x + FRAME_PAD_X; x = frameRight; }
      const walls = framed ? [frameLeft, frameRight] : [];

      // 纵向：框标题 | 上绕线 | 模块网格 | 下方反馈线。
      const frameTop = PAD_Y;
      const bandTop = PAD_Y + (framed ? FRAME_TITLE_H : 0);
      const gridTop = bandTop + (upper.length ? 26 + (upper.length - 1) * laneStep + maxLabelHeight + LABEL_GAP + 4 : 0);
      const rows = Math.max(...layers.map(nodes => nodes.length));
      const gridHeight = rows * NODE_H + (rows - 1) * ROW_GAP;
      const gridBottom = gridTop + gridHeight;
      layers.forEach(nodes => {
        const height = nodes.length * NODE_H + (nodes.length - 1) * ROW_GAP;
        nodes.forEach((node, row) => { node.y = gridTop + (gridHeight - height) / 2 + row * (NODE_H + ROW_GAP); });
      });
      const contentBottom = gridBottom + (feedback.length ? 30 + (feedback.length - 1) * laneStep + LABEL_GAP + maxLabelHeight : 0);
      const frameBottom = contentBottom + (framed ? FRAME_PAD_BOTTOM : 0);

      // 输出从右侧出、输入从左侧进；上绕线占上方端口，反馈线占下方端口。
      const routeOrder = { upper: 0, forward: 1, feedback: 2 };
      const portOrder = other => (a, b) => routeOrder[a.route] - routeOrder[b.route]
        || (a.route === "upper" ? a.lane - b.lane : a.route === "feedback" ? b.lane - a.lane : view.nodes.get(a[other]).y - view.nodes.get(b[other]).y);
      for (const node of view.nodes.values()) {
        const place = (list, key) => list.forEach((edge, i) => { edge[key] = node.y + 14 + (i + 1) * (NODE_H - 28) / (list.length + 1); });
        place(view.edges.filter(edge => edge.source === node.id).sort(portOrder("target")), "sourceY");
        place(view.edges.filter(edge => edge.target === node.id).sort(portOrder("source")), "targetY");
      }

      // 标签放在线的一侧，并避开虚线框的竖边。
      function clearSpan(a, b, need) {
        const low = Math.min(a, b), high = Math.max(a, b);
        const cuts = walls.filter(wall => wall > low + 1 && wall < high - 1).sort((p, q) => p - q);
        const pieces = [];
        let start = low;
        for (const cut of cuts) { pieces.push([start, cut]); start = cut; }
        pieces.push([start, high]);
        const fitting = pieces.filter(([p, q]) => q - p >= need);
        return (fitting.length ? fitting : pieces).reduce((best, piece) => piece[1] - piece[0] > best[1] - best[0] ? piece : best);
      }
      const labelBox = (edge, centerX, lineY, below) => ({
        x: centerX, top: below ? lineY + LABEL_GAP : lineY - LABEL_GAP - edge.labelHeight, width: edge.labelWidth, height: edge.labelHeight
      });
      const setLabel = (edge, box) => {
        edge.labelX = box.x;
        edge.labelTop = box.top;
        edge.labelOnFrame = framed && box.x > frameLeft && box.x < frameRight;
      };
      const laneOffset = lane => 16 + (lane % 4) * 9;
      const used = [];
      for (const edge of view.edges) {
        const source = view.nodes.get(edge.source), target = view.nodes.get(edge.target);
        const sx = source.x + nodeW, tx = target.x, sy = edge.sourceY, ty = edge.targetY;
        if (edge.route !== "forward") {
          const below = edge.route === "feedback";
          const lineY = below ? gridBottom + 30 + edge.lane * laneStep : gridTop - 26 - edge.lane * laneStep;
          const rx = sx + laneOffset(edge.lane), lx = tx - laneOffset(edge.lane);
          edge.path = roundedPath([[sx, sy], [rx, sy], [rx, lineY], [lx, lineY], [lx, ty], [tx, ty]]);
          const [pa, pb] = clearSpan(rx, lx, edge.labelWidth + 24);
          setLabel(edge, labelBox(edge, (pa + pb) / 2, lineY, below));
          continue;
        }
        const [pa, pb] = clearSpan(sx, tx, edge.labelWidth + 40);
        const cx = (pa + pb) / 2, half = Math.max(4, Math.min(edge.labelWidth / 2 + 6, (pb - pa) / 2 - 16));
        const base = (sy + ty) / 2, step = maxLabelHeight + LABEL_GAP + 8;
        const minY = gridTop + edge.labelHeight + LABEL_GAP + 2, maxY = gridBottom - 4;
        let lineY = Math.max(minY, Math.min(maxY, base));
        for (const offset of [0, -1, 1, -2, 2, -3, 3]) {
          const candidate = Math.max(minY, Math.min(maxY, base + offset * step));
          const box = labelBox(edge, cx, candidate, false);
          if (!used.some(other => Math.abs(other.x - box.x) < (other.width + box.width) / 2 + 10 && box.top < other.top + other.height + 8 && other.top < box.top + box.height + 8)) {
            lineY = candidate;
            break;
          }
        }
        const left = cx - half, right = cx + half;
        const d1 = Math.max(8, (left - sx) * .55), d2 = Math.max(8, (tx - right) * .55);
        edge.path = `M ${sx} ${sy} C ${sx + d1} ${sy}, ${left - d1} ${lineY}, ${left} ${lineY} L ${right} ${lineY} C ${right + d2} ${lineY}, ${tx - d2} ${ty}, ${tx} ${ty}`;
        const box = labelBox(edge, cx, lineY, false);
        setLabel(edge, box);
        used.push(box);
      }
      view.nodeW = nodeW;
      view.frame = framed ? { x: frameLeft, y: frameTop, width: frameRight - frameLeft, height: frameBottom - frameTop } : null;
      view.width = x + PAD_X;
      view.height = frameBottom + PAD_Y;
    }

    function roundedPath(points, radius = 10) {
      const clean = points.filter((point, i) => !i || point[0] !== points[i - 1][0] || point[1] !== points[i - 1][1]);
      let path = `M ${clean[0][0]} ${clean[0][1]}`;
      for (let i = 1; i < clean.length - 1; i++) {
        const a = clean[i - 1], b = clean[i], c = clean[i + 1];
        const before = Math.hypot(a[0] - b[0], a[1] - b[1]), after = Math.hypot(c[0] - b[0], c[1] - b[1]);
        const r = Math.min(radius, before / 2, after / 2);
        const start = [b[0] + (a[0] - b[0]) * r / before, b[1] + (a[1] - b[1]) * r / before];
        const end = [b[0] + (c[0] - b[0]) * r / after, b[1] + (c[1] - b[1]) * r / after];
        path += ` L ${start[0]} ${start[1]} Q ${b[0]} ${b[1]} ${end[0]} ${end[1]}`;
      }
      const last = clean[clean.length - 1];
      return path + ` L ${last[0]} ${last[1]}`;
    }

    /* ---------- 绘制 ---------- */

    function activateWithKeyboard(node, callback) {
      node.addEventListener("click", callback);
      node.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); callback(); }
      });
    }

    function markerUrl(color) {
      const id = "arrow-" + color.replace(/[^0-9a-z]/gi, "");
      if (state.svg && !state.markers.has(id)) {
        const marker = svgElement("marker", { id, viewBox: "0 0 9 8", refX: 8.6, refY: 4, markerWidth: 9, markerHeight: 8, orient: "auto", markerUnits: "userSpaceOnUse" });
        marker.append(svgElement("path", { d: "M 0 .6 L 9 4 L 0 7.4 L 2 4 Z", fill: color }));
        state.svg.querySelector("defs").append(marker);
        state.markers.add(id);
      }
      return `url(#${id})`;
    }

    function drawFrame(view, layer) {
      const frame = view.frame, module = state.model.modules.get(state.level);
      layer.append(svgElement("rect", { class: "frame-box", x: frame.x, y: frame.y, width: frame.width, height: frame.height, rx: 10 }));
      const name = truncate(module?.name || state.level, frame.width - 40, 13.5, 600);
      layer.append(svgElement("text", { class: "frame-name", x: frame.x + 18, y: frame.y + 27 }, name));
      const idX = frame.x + 18 + textWidth(name, 13.5, 600) + 10;
      if (idX + 60 < frame.x + frame.width) layer.append(svgElement("text", { class: "frame-id", x: idX, y: frame.y + 27 }, state.level));
    }

    function drawEdge(edge, layer) {
      const group = svgElement("g", { class: "edge", tabindex: 0, role: "button", "aria-label": `${moduleName(edge.source)} 到 ${moduleName(edge.target)}：${edge.label}；${edge.names.length > 1 ? "选择要观测的数据" : "切换观测"}` });
      group.append(svgElement("title", {}, edge.flows.map(flow => `${flow.label} · ${flow.name}`).join("\n")));
      const line = svgElement("path", { class: "edge-line", d: edge.path });
      const dots = svgElement("g");
      group.append(line, svgElement("path", { class: "edge-motion", d: edge.path }), svgElement("path", { class: "edge-hit", d: edge.path }));
      group.append(svgElement("rect", { class: "edge-label-hit", x: edge.labelX - edge.labelWidth / 2 - 4, y: edge.labelTop - 2, width: edge.labelWidth + 8, height: edge.labelHeight + 4 }));
      const label = svgElement("text", { class: "edge-label" + (edge.labelOnFrame ? " on-frame" : ""), "text-anchor": "middle" });
      edge.labelLines.forEach((text, i) => label.append(svgElement("tspan", { x: edge.labelX, y: edge.labelTop + 11.5 + i * LABEL_LINE }, text)));
      group.append(label, dots);
      activateWithKeyboard(group, () => activateEdge(edge));
      group.addEventListener("pointerenter", () => setFocus({ edge }));
      group.addEventListener("pointerleave", () => setFocus(null));
      layer.append(group);
      state.edgeElements.push({ group, line, dots, edge, signature: null, length: 0 });
    }

    function drawNode(node, layer, view) {
      const width = view.nodeW, expandable = node.children > 0;
      const hint = node.external ? `；跳转到${node.module.name}` : expandable ? "；进入查看子模块" : "；查看说明";
      const group = svgElement("g", { class: "node" + (node.external ? " external" : ""), transform: `translate(${node.x}, ${node.y})`, tabindex: 0, role: "button", "aria-label": `${node.module.name}：${node.module.summary}${hint}` });
      group.append(svgElement("title", {}, node.module.name + (node.module.summary ? "\n" + node.module.summary : "") + (node.external ? "\n点击跳转" : expandable ? "\n点击进入" : "")));
      if (expandable) group.append(svgElement("rect", { class: "node-stack", x: 4, y: 4, width, height: NODE_H, rx: 6 }));
      group.append(svgElement("rect", { class: "node-box", width, height: NODE_H, rx: 6 }));
      group.append(svgElement("text", { class: "node-name", x: 16, y: 27 }, node.nameText));
      if (node.summaryText) group.append(svgElement("text", { class: "node-summary", x: 16, y: 46 }, node.summaryText));
      if (expandable || node.external) group.append(svgElement("path", { class: "node-chevron", d: `M ${width - 19} ${NODE_H / 2 - 4} L ${width - 15} ${NODE_H / 2} L ${width - 19} ${NODE_H / 2 + 4}` }));
      activateWithKeyboard(group, () => {
        if (node.external) jumpTo(node.id);
        else if (expandable) navigate(node.id);
        else if (state.popover?.kind === "module" && state.popover.id === node.id) closePopover();
        else openPopover({ kind: "module", id: node.id });
      });
      group.addEventListener("pointerenter", () => setFocus({ node: node.id }));
      group.addEventListener("pointerleave", () => setFocus(null));
      layer.append(group);
      state.nodeElements.set(node.id, group);
    }

    // 悬停时突出相关的块与箭头，其余淡出。
    function setFocus(target) {
      if (!state.svg) return;
      const nodes = new Set(), edges = new Set();
      if (target?.node) {
        nodes.add(target.node);
        for (const { edge } of state.edgeElements) {
          if (edge.source !== target.node && edge.target !== target.node) continue;
          edges.add(edge.key);
          nodes.add(edge.source);
          nodes.add(edge.target);
        }
      } else if (target?.edge) {
        edges.add(target.edge.key);
        nodes.add(target.edge.source);
        nodes.add(target.edge.target);
      }
      state.svg.classList.toggle("focusing", !!target);
      state.nodeElements.forEach((group, id) => group.classList.toggle("related", nodes.has(id)));
      state.edgeElements.forEach(({ group, edge }) => {
        group.classList.toggle("related", edges.has(edge.key));
        group.classList.toggle("hover", !!target?.edge && target.edge.key === edge.key);
      });
      updateEdges();
    }

    function render(transition = "") {
      renderBreadcrumbs();
      graph.replaceChildren();
      state.edgeElements = [];
      state.nodeElements = new Map();
      state.svg = null;
      state.wrap = null;
      const view = buildView();
      state.view = view;
      if (!view.nodes.size) {
        const message = state.text === null ? (state.moduleError ? "无法读取 module.md：" + state.moduleError : "正在读取模块说明…") : state.level ? "当前模块没有可显示的子模块，可通过面包屑返回上层。" : "模块说明中暂无可显示的模块。";
        graph.append(element("div", "empty", message));
      } else {
        layout(view);
        const wrap = element("div", "graph-wrap");
        const svg = svgElement("svg", { class: "graph-svg" + (transition ? " enter-" + transition : ""), viewBox: `0 0 ${view.width} ${view.height}`, role: "group", "aria-label": "模块与数据流关系图" });
        const defs = svgElement("defs");
        const shadow = svgElement("filter", { id: "node-shadow", x: "-10%", y: "-20%", width: "120%", height: "150%" });
        shadow.append(svgElement("feDropShadow", { dx: 0, dy: 1, stdDeviation: 1.4, "flood-color": "#1c2026", "flood-opacity": .055 }));
        defs.append(shadow);
        svg.append(defs);
        state.svg = svg;
        state.markers = new Set();
        const frameLayer = svgElement("g"), edgeLayer = svgElement("g"), nodeLayer = svgElement("g");
        svg.append(frameLayer, edgeLayer, nodeLayer);
        if (view.frame) drawFrame(view, frameLayer);
        const priority = { feedback: 0, upper: 1, forward: 2 };
        [...view.edges].sort((a, b) => priority[a.route] - priority[b.route]).forEach(edge => drawEdge(edge, edgeLayer));
        view.nodes.forEach(node => drawNode(node, nodeLayer, view));
        svg.addEventListener("pointerleave", () => setFocus(null));
        wrap.append(svg);
        graph.append(wrap);
        state.wrap = wrap;
        state.edgeElements.forEach(item => { item.length = item.line.getTotalLength(); });
        fitGraph();
      }
      refreshPopover();
      updateEdges();
    }

    function fitGraph() {
      const wrap = state.wrap, view = state.view;
      if (!wrap || !view?.width) return;
      const style = getComputedStyle(graph);
      const width = graph.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const height = graph.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      if (width <= 0 || height <= 0) return;
      // 按容器自动缩放并居中；模块少时适度放大，过小时允许滚动。
      const scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, width / view.width, height / view.height));
      wrap.style.width = view.width * scale + "px";
      wrap.style.height = view.height * scale + "px";
      positionPopover();
    }

    // 把布局坐标换算成画布内的像素位置（不受入场动画的缩放影响）。
    function viewRect(x, y, width, height) {
      if (!state.wrap || !state.view) return null;
      const wrap = state.wrap.getBoundingClientRect(), base = canvas.getBoundingClientRect();
      const scale = wrap.width / state.view.width;
      const left = wrap.left - base.left + x * scale, top = wrap.top - base.top + y * scale;
      return { left, top, width: width * scale, height: height * scale, right: left + width * scale, bottom: top + height * scale };
    }

    function nodeRect(id) {
      const node = state.view?.nodes.get(id);
      return node ? viewRect(node.x, node.y, state.view.nodeW, NODE_H) : null;
    }

    function frameRect() {
      const frame = state.view?.frame;
      return frame ? viewRect(frame.x, frame.y, frame.width, frame.height) : null;
    }

    /* ---------- 层级切换 ---------- */

    function navigate(target, after) {
      if (target === state.level) { after?.(); return; }
      const previous = state.level;
      const deeper = previous ? target.startsWith(previous + "/") : target !== "";
      const shallower = target ? previous.startsWith(target + "/") : previous !== "";
      const from = deeper ? nodeRect(childToward(previous, target)) : shallower ? frameRect() : null;
      closePopover();
      state.level = target;
      render(deeper ? "in" : shallower ? "out" : "fade");
      const to = deeper ? frameRect() : shallower ? nodeRect(childToward(target, previous)) : null;
      if (from && to) morph(from, to);
      after?.();
    }

    // 进入时块展开成虚线框，返回时虚线框收拢回块。
    function morph(from, to) {
      if (!Element.prototype.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const box = element("div", "morph");
      canvas.append(box);
      const rect = r => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
      const animation = box.animate([
        { ...rect(from), opacity: 1 },
        { ...rect(to), opacity: 1, offset: .72 },
        { ...rect(to), opacity: 0 }
      ], { duration: 460, easing: "cubic-bezier(.2, .7, .2, 1)", fill: "forwards" });
      animation.onfinish = animation.oncancel = () => box.remove();
    }

    function jumpTo(id) {
      if (hasChildren(id)) { navigate(id); return; }
      navigate(parentId(id), () => {
        if (state.view?.nodes.has(id) && !state.view.nodes.get(id).external) openPopover({ kind: "module", id });
      });
    }

    /* ---------- 浮层 ---------- */

    function openPopover(spec) {
      state.popover = spec;
      popover.hidden = false;
      buildPopover();
      if (!state.popover) return;
      positionPopover();
      popover.style.animation = "none";
      void popover.offsetWidth;
      popover.style.animation = "";
    }

    function closePopover() {
      if (!state.popover) return;
      state.popover = null;
      popover.hidden = true;
      popover.replaceChildren();
      markOpen();
    }

    function buildPopover() {
      const spec = state.popover;
      popover.replaceChildren();
      if (spec.kind === "module") {
        const module = state.model.modules.get(spec.id);
        if (!module || !state.view?.nodes.has(spec.id)) { closePopover(); return; }
        popover.className = "popover";
        popover.setAttribute("role", "dialog");
        popover.setAttribute("aria-label", module.name + "的说明");
        popover.append(element("h3", "pop-name", module.name), element("code", "pop-id", module.id));
        popover.append(element("p", "pop-summary", module.summary || "—"));
        popover.append(element("div", "pop-label", "详细"), element("p", "pop-detail", module.detail || "—"));
      } else {
        const edge = state.view?.edges.find(item => item.key === spec.key);
        if (!edge) { closePopover(); return; }
        popover.className = "popover menu";
        popover.setAttribute("role", "dialog");
        popover.setAttribute("aria-label", "选择要观测的数据");
        const head = element("div", "menu-head");
        head.append(element("strong", "", `${moduleName(edge.source)} → ${moduleName(edge.target)}`), document.createTextNode(" · 选择要观测的数据"));
        const list = element("div", "menu-list");
        for (const name of edge.names) {
          const flow = edge.flows.find(item => item.name === name);
          const row = element("label", "menu-row");
          const input = element("input");
          input.type = "checkbox";
          input.dataset.name = name;
          input.addEventListener("change", () => toggleObserve(name));
          const box = element("i", "menu-box");
          box.append(icon("M 3.5 7.2 L 6 9.6 L 10.5 4.6", 11));
          box.style.color = "#fff";
          const text = element("span", "menu-text");
          text.append(element("span", "menu-label", flow.label || name), element("span", "menu-sub", `${name} · ${flow.display || "—"}`));
          row.append(input, box, text);
          list.append(row);
        }
        popover.append(head, list);
        updateMenuChecks();
      }
      markOpen();
    }

    function updateMenuChecks() {
      if (state.popover?.kind !== "menu") return;
      popover.querySelectorAll("input[data-name]").forEach(input => {
        const color = state.observed.get(input.dataset.name);
        input.checked = !!color;
        input.closest(".menu-row").style.setProperty("--c", color || "#1c2026");
      });
    }

    function refreshPopover() {
      if (!state.popover) return;
      buildPopover();
      positionPopover();
    }

    function markOpen() {
      const spec = state.popover;
      state.nodeElements.forEach((group, id) => group.classList.toggle("open", spec?.kind === "module" && spec.id === id));
      state.edgeElements.forEach(({ group, edge }) => group.classList.toggle("menu-open", spec?.kind === "menu" && spec.key === edge.key));
    }

    function positionPopover() {
      const spec = state.popover;
      if (!spec || popover.hidden) return;
      let anchor = null;
      if (spec.kind === "module") anchor = nodeRect(spec.id);
      else {
        const edge = state.view?.edges.find(item => item.key === spec.key);
        if (edge) anchor = viewRect(edge.labelX - edge.labelWidth / 2, edge.labelTop, edge.labelWidth, edge.labelHeight);
      }
      if (!anchor) return;
      const width = canvas.clientWidth, height = canvas.clientHeight;
      const popWidth = popover.offsetWidth, popHeight = popover.offsetHeight;
      let left, top;
      if (spec.kind === "module") {
        left = anchor.right + 12;
        if (left + popWidth > width - 10) left = anchor.left - 12 - popWidth;
        top = anchor.top - 4;
      } else {
        left = anchor.left + anchor.width / 2 - popWidth / 2;
        top = anchor.bottom + 8;
        if (top + popHeight > height - 10) top = anchor.top - 8 - popHeight;
      }
      popover.style.left = Math.max(10, Math.min(width - popWidth - 10, left)) + "px";
      popover.style.top = Math.max(10, Math.min(height - popHeight - 10, top)) + "px";
    }

    /* ---------- 观测 ---------- */

    function hexToRgb(hex) {
      const value = parseInt(hex.slice(1), 16);
      return [value >> 16 & 255, value >> 8 & 255, value & 255];
    }

    function mix(a, b, amount) {
      const from = hexToRgb(a), to = hexToRgb(b);
      return "#" + from.map((channel, i) => Math.round(channel + (to[i] - channel) * amount).toString(16).padStart(2, "0")).join("");
    }

    // 数组中的各元素用同一色相的深浅区分。
    function shade(color, index) {
      if (!index) return color;
      const steps = [0, -.42, .4, -.64, .6, -.24, .22, -.78];
      const amount = steps[index % steps.length] || (index % 2 ? -.3 : .3);
      return amount < 0 ? mix(color, "#1c2026", -amount) : mix(color, "#ffffff", amount);
    }

    function paletteColor(index) {
      const round = Math.floor(index / PALETTE.length), base = PALETTE[index % PALETTE.length];
      return round ? mix(base, "#1c2026", Math.min(.5, round * .28)) : base;
    }

    function nextColor() {
      const used = new Set(state.observed.values());
      for (let i = 0; ; i++) if (!used.has(paletteColor(i))) return paletteColor(i);
    }

    function activateEdge(edge) {
      if (edge.names.length === 1) {
        closePopover();
        toggleObserve(edge.names[0]);
      } else if (state.popover?.kind === "menu" && state.popover.key === edge.key) {
        closePopover();
      } else {
        openPopover({ kind: "menu", key: edge.key });
      }
    }

    function toggleObserve(name) {
      if (state.observed.has(name)) {
        state.observed.delete(name);
        live.cache.delete(name);
        live.lastTs.delete(name);
        state.frozen?.cache.delete(name);
      } else {
        state.observed.set(name, nextColor());
      }
      updateEdges();
      updateMenuChecks();
      rebuildCards();
      renderCards();
    }

    function flowIsLive(name, now) {
      const timestamp = state.names.get(name);
      return Number.isFinite(timestamp) && now - timestamp >= 0 && now - timestamp <= ACTIVE_SECONDS;
    }

    function updateEdges() {
      const now = Date.now() / 1000;
      for (const item of state.edgeElements) {
        const { group, line, edge } = item;
        const active = edge.flows.some(flow => flowIsLive(flow.name, now));
        const watched = edge.names.filter(name => state.observed.has(name));
        const color = watched.length ? state.observed.get(watched[0]) : "";
        group.classList.toggle("active", active);
        group.classList.toggle("observed", !!color);
        line.style.stroke = color;
        const hovered = group.classList.contains("hover") || group.classList.contains("menu-open");
        line.setAttribute("marker-end", markerUrl(color || (active ? EDGE_COLORS.active : hovered ? EDGE_COLORS.hover : EDGE_COLORS.muted)));
        const signature = watched.map(name => state.observed.get(name)).join();
        if (signature !== item.signature) {
          item.signature = signature;
          item.dots.replaceChildren();
          // 在箭头中点放同色圆点，多条被观测时沿线并排。
          watched.forEach((name, i) => {
            const at = Math.max(0, Math.min(item.length, item.length / 2 + (i - (watched.length - 1) / 2) * 11));
            const point = line.getPointAtLength(at);
            item.dots.append(svgElement("circle", { class: "edge-dot", cx: point.x, cy: point.y, r: 4, fill: state.observed.get(name) }));
          });
        }
      }
    }

    function displayKind(display) {
      return display === "曲线" || display === "波形" ? "curve" : display === "数值" ? "number" : "text";
    }

    function createCard(name, kind) {
      const el = element("article", "card");
      const head = element("header", "card-head");
      const title = element("h3", "card-title");
      const remove = element("button", "card-remove");
      remove.type = "button";
      remove.setAttribute("aria-label", "移除观测");
      remove.title = "移除观测";
      remove.append(icon("M 3.5 3.5 L 10.5 10.5 M 10.5 3.5 L 3.5 10.5", 12));
      remove.addEventListener("click", () => toggleObserve(name));
      head.append(element("i", "card-dot"), title, remove);
      const meta = element("div", "card-meta");
      const empty = element("div", "card-empty", "等待数据");
      const body = element("div", "card-body");
      body.hidden = true;
      el.append(head, meta, empty, body);
      const card = { name, kind, el, title, meta, empty, body };
      if (kind === "curve") {
        card.readout = element("div", "readout");
        card.values = element("div", "readout-values");
        card.time = element("span", "readout-time");
        card.readout.append(card.values, card.time);
        card.canvas = element("canvas", "chart");
        card.canvas.setAttribute("role", "img");
        bindHover(card.canvas);
        body.append(card.readout, card.canvas);
      } else if (kind === "number") {
        const row = element("div", "number-row");
        card.value = element("div", "number-value");
        card.time = element("span", "readout-time");
        row.append(card.value, card.time);
        card.readout = row;
        card.canvas = element("canvas", "spark");
        card.canvas.setAttribute("role", "img");
        bindHover(card.canvas);
        body.append(row, card.canvas);
      } else {
        card.list = element("ol", "entries");
        body.append(card.list);
      }
      return card;
    }

    function rebuildCards() {
      const names = [...state.observed.keys()];
      observeEl.classList.toggle("empty", !names.length);
      document.getElementById("observe-count").textContent = names.length ? `${names.length} 条` : "";
      for (const [name, card] of cards) {
        if (!state.observed.has(name)) { card.el.remove(); cards.delete(name); }
      }
      names.forEach((name, index) => {
        const flow = flowInfo(name), kind = displayKind(flow?.display);
        let card = cards.get(name);
        if (!card || card.kind !== kind) {
          card?.el.remove();
          card = createCard(name, kind);
          cards.set(name, card);
        }
        card.el.style.setProperty("--c", state.observed.get(name));
        card.title.replaceChildren(element("span", "", flow ? flow.label || name : name));
        if (flow) card.title.append(element("span", "card-route", `（${moduleName(flow.source)} → ${moduleName(flow.target)}）`));
        card.meta.replaceChildren(element("code", "", name), document.createTextNode(` · ${flow?.display || "文本"}`));
        if (card.canvas) card.canvas.setAttribute("aria-label", (flow?.label || name) + "最近 10 秒的数据折线图");
        if (cardsEl.children[index] !== card.el) cardsEl.insertBefore(card.el, cardsEl.children[index] || null);
      });
      updatePause();
    }

    function bindHover(target) {
      target.addEventListener("pointermove", event => {
        const plot = target.plot;
        if (!plot) return;
        const ratio = (event.clientX - target.getBoundingClientRect().left - plot.left) / (plot.right - plot.left);
        setHover(ratio < 0 || ratio > 1 ? null : (ratio - 1) * LIVE_SECONDS);
      });
      target.addEventListener("pointerleave", () => setHover(null));
    }

    // 悬停位置记为相对“现在”的偏移，所有卡片在同一时刻显示竖线。
    function setHover(offset) {
      if (state.hoverOffset === offset) return;
      state.hoverOffset = offset;
      scheduleCards();
    }

    function scheduleCards() {
      if (cardFrame) return;
      cardFrame = requestAnimationFrame(() => { cardFrame = 0; renderCards(); });
    }

    function viewNow() {
      return state.paused ? state.frozen.now : Date.now() / 1000;
    }

    // 暂停时显示冻结的快照，后台缓存照常更新。
    function pointsFor(name) {
      if (state.paused) {
        const frozen = state.frozen.cache.get(name);
        if (frozen) return frozen;
        return (live.cache.get(name) || []).filter(point => point[0] <= state.frozen.now);
      }
      return live.cache.get(name) || [];
    }

    function sampleAt(points, time) {
      let low = 0, high = points.length - 1;
      while (low < high) {
        const middle = (low + high) >> 1;
        if (points[middle][0] < time) low = middle + 1;
        else high = middle;
      }
      const candidates = [points[low], points[low - 1]].filter(Boolean);
      const nearest = candidates.reduce((best, point) => Math.abs(point[0] - time) < Math.abs(best[0] - time) ? point : best, candidates[0]);
      return nearest && Math.abs(nearest[0] - time) <= 1 ? nearest : null;
    }

    function renderCards() {
      if (!cards.size) return;
      const now = viewNow();
      const hover = state.hoverOffset === null ? null : now + state.hoverOffset;
      for (const [name, card] of cards) {
        const color = state.observed.get(name);
        const points = pointsFor(name).filter(point => point[0] >= now - LIVE_SECONDS && point[0] <= now);
        card.empty.hidden = points.length > 0;
        card.body.hidden = points.length === 0;
        if (!points.length) continue;
        const latest = points[points.length - 1];
        const sample = hover === null ? latest : sampleAt(points, hover);
        if (card.kind === "curve") {
          card.readout.classList.toggle("hovering", hover !== null);
          card.time.textContent = hover === null ? "最新 " + clockTime(latest[0], true) : clockTime(hover, true);
          renderValues(card, sample ? sample[1] : null, color);
          drawChart(card.canvas, points, now, color, { height: 120, axes: true, hover });
        } else if (card.kind === "number") {
          const value = sample ? sample[1] : null;
          card.readout.classList.toggle("hovering", hover !== null);
          card.value.textContent = sample ? formatValue(value) : "—";
          card.value.classList.toggle("raw", sample !== null && typeof value !== "number");
          card.time.textContent = hover === null ? "最新 " + clockTime(latest[0], true) : clockTime(hover, true);
          card.canvas.hidden = !points.some(point => typeof point[1] === "number" && Number.isFinite(point[1]));
          if (!card.canvas.hidden) drawChart(card.canvas, points, now, color, { height: 38, axes: false, hover });
        } else {
          card.list.replaceChildren();
          points.slice(-5).reverse().forEach(([time, value]) => {
            const row = element("li", "entry");
            row.append(element("time", "", clockTime(time, true)), element("span", "entry-value", formatValue(value)));
            card.list.append(row);
          });
        }
      }
    }

    function renderValues(card, value, color) {
      card.values.replaceChildren();
      if (Array.isArray(value)) {
        const list = element("div", "channels");
        value.forEach((item, index) => {
          const row = element("div", "channel");
          const swatch = element("i");
          swatch.style.background = shade(color, index);
          row.append(swatch, element("span", "channel-index", `[${index}]`), element("span", "channel-value", formatValue(item)));
          list.append(row);
        });
        if (!value.length) list.append(element("span", "channel-value", "[]"));
        card.values.append(list);
      } else {
        card.values.append(element("div", "readout-value", value === null ? "—" : formatValue(value)));
      }
    }

    function signed(text) {
      return text.replace(/^-/, "−");
    }

    // 数字统一保留 3 位小数，数字列表逐项处理。
    function formatValue(value) {
      if (typeof value === "number" && Number.isFinite(value)) return signed(value.toFixed(3));
      if (Array.isArray(value)) return "[" + value.map(formatValue).join(", ") + "]";
      return typeof value === "string" ? value : JSON.stringify(value);
    }

    function clockTime(timestamp, precise) {
      const date = new Date(timestamp * 1000);
      if (!Number.isFinite(date.getTime())) return "—";
      const clock = [date.getHours(), date.getMinutes(), date.getSeconds()].map(value => String(value).padStart(2, "0")).join(":");
      return precise ? clock + "." + Math.floor(date.getMilliseconds() / 100) : clock;
    }

    function drawChart(target, points, now, color, { height, axes, hover }) {
      const width = target.getBoundingClientRect().width;
      if (width <= 0) return;
      const context = target.getContext("2d");
      if (!context) return;
      const ratio = window.devicePixelRatio || 1;
      const pixelWidth = Math.max(1, Math.round(width * ratio)), pixelHeight = Math.round(height * ratio);
      if (target.width !== pixelWidth) target.width = pixelWidth;
      if (target.height !== pixelHeight) target.height = pixelHeight;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);
      let minimum = Infinity, maximum = -Infinity, channels = 0;
      const samples = points.map(([timestamp, value]) => {
        const values = Array.isArray(value) ? value : [value];
        channels = Math.max(channels, values.length);
        values.forEach(number => {
          if (typeof number !== "number" || !Number.isFinite(number)) return;
          minimum = Math.min(minimum, number);
          maximum = Math.max(maximum, number);
        });
        return { timestamp, values };
      });
      const left = axes ? CHART_LEFT : 2, right = width - (axes ? 6 : 2), top = axes ? 8 : 5, bottom = height - (axes ? 21 : 5);
      target.plot = { left, right };
      if (minimum === Infinity) {
        if (axes) {
          context.font = `11px ${FONT}`;
          context.fillStyle = "#a3a8ae";
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillText("非数值数据，无法绘制曲线", width / 2, height / 2);
        }
        return;
      }
      if (minimum === maximum) {
        const padding = Math.max(Math.abs(minimum) * .05, 0.000001);
        minimum = Math.max(-Number.MAX_VALUE, minimum - padding);
        maximum = Math.min(Number.MAX_VALUE, maximum + padding);
      } else {
        const padding = maximum * .08 - minimum * .08;
        minimum = Math.max(-Number.MAX_VALUE, minimum - padding);
        maximum = Math.min(Number.MAX_VALUE, maximum + padding);
      }
      const plotWidth = Math.max(1, right - left), plotHeight = bottom - top;
      if (axes) {
        const axisValue = number => signed(String(Number(number.toPrecision(3))));
        const ticks = [[top, maximum], [(top + bottom) / 2, minimum / 2 + maximum / 2], [bottom, minimum]];
        context.lineWidth = 1;
        context.strokeStyle = "#efefea";
        context.font = `10px ${MONO}`;
        context.fillStyle = "#a3a8ae";
        context.textAlign = "right";
        context.textBaseline = "middle";
        for (const [y, value] of ticks) {
          const crisp = Math.round(y) + .5;
          context.beginPath();
          context.moveTo(left, crisp);
          context.lineTo(right, crisp);
          context.stroke();
          context.fillText(axisValue(value), left - 7, y);
        }
        context.font = `10px ${FONT}`;
        context.textBaseline = "alphabetic";
        context.textAlign = "left";
        context.fillText(`${LIVE_SECONDS} 秒前`, left, height - 5);
        context.textAlign = "center";
        context.fillText(`${LIVE_SECONDS / 2} 秒前`, left + plotWidth / 2, height - 5);
        context.textAlign = "right";
        context.fillText("现在", right, height - 5);
      }
      // 先缩放数值再计算比例，避免极大正负值相减时溢出。
      const magnitude = Math.max(Math.abs(minimum), Math.abs(maximum), Number.MIN_VALUE);
      const lower = minimum / magnitude, range = maximum / magnitude - lower;
      const toX = timestamp => left + (timestamp - (now - LIVE_SECONDS)) / LIVE_SECONDS * plotWidth;
      const toY = value => bottom - (range ? (value / magnitude - lower) / range : .5) * plotHeight;
      const ends = [];
      context.save();
      context.beginPath();
      context.rect(left, top - 3, plotWidth, plotHeight + 6);
      context.clip();
      for (let channel = 0; channel < channels; channel++) {
        context.strokeStyle = shade(color, channel);
        context.lineWidth = axes ? 1.6 : 1.4;
        context.lineJoin = "round";
        context.lineCap = "round";
        let connected = false, last = null;
        context.beginPath();
        for (const sample of samples) {
          const value = sample.values[channel];
          if (typeof value !== "number" || !Number.isFinite(value)) { connected = false; continue; }
          const x = toX(sample.timestamp), y = toY(value);
          if (connected) context.lineTo(x, y);
          else context.moveTo(x, y);
          connected = true;
          last = [x, y];
        }
        context.stroke();
        if (last) ends.push([last, shade(color, channel)]);
      }
      context.restore();
      const dot = (x, y, fill, radius) => {
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fillStyle = fill;
        context.strokeStyle = "#fff";
        context.lineWidth = 1.5;
        context.fill();
        context.stroke();
      };
      if (hover !== null && hover >= now - LIVE_SECONDS && hover <= now) {
        const x = Math.round(toX(hover)) + .5;
        context.strokeStyle = "rgba(28, 32, 38, .3)";
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(x, top - 3);
        context.lineTo(x, bottom + 3);
        context.stroke();
        const sample = sampleAt(points, hover);
        const values = sample ? (Array.isArray(sample[1]) ? sample[1] : [sample[1]]) : [];
        values.forEach((value, channel) => {
          if (typeof value === "number" && Number.isFinite(value)) dot(toX(sample[0]), toY(value), shade(color, channel), axes ? 3 : 2.4);
        });
      } else {
        ends.forEach(([[x, y], fill]) => dot(x, y, fill, axes ? 2.8 : 2.2));
      }
    }

    function updatePause() {
      pauseButton.classList.toggle("paused", state.paused);
      pauseButton.replaceChildren(
        state.paused ? icon("M 4.5 3 L 11 7 L 4.5 11 Z", 12) : icon("M 5 3.5 V 10.5 M 9 3.5 V 10.5", 12),
        document.createTextNode(state.paused ? "继续" : "暂停")
      );
      pauseButton.setAttribute("aria-pressed", String(state.paused));
      document.getElementById("pause-note").textContent = state.paused ? "已暂停于 " + clockTime(state.frozen.now) : "";
    }

    pauseButton.addEventListener("click", () => {
      state.paused = !state.paused;
      state.frozen = state.paused ? { now: Date.now() / 1000, cache: new Map([...live.cache].map(([name, points]) => [name, points.slice()])) } : null;
      updatePause();
      renderCards();
    });

    /* ---------- 数据获取 ---------- */

    async function pollData() {
      const names = [...state.observed.keys()].sort();
      if (!names.length || live.controller) return;
      const key = names.join(",");
      if (key !== live.namesKey) {
        const known = new Set(live.namesKey ? live.namesKey.split(",") : []);
        // 新增数据名时重新全量读取一次，按时间戳去重。
        if (names.some(name => !known.has(name))) live.since = null;
        live.namesKey = key;
      }
      const controller = new AbortController();
      live.controller = controller;
      const timeout = setTimeout(() => controller.abort(), 5000);
      const query = new URLSearchParams({ names: key });
      if (live.since !== null) query.set("since", String(live.since));
      try {
        const response = await fetch("/data?" + query.toString(), { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const payload = await response.json();
        if (!payload || typeof payload !== "object" || Array.isArray(payload)) return;
        const cutoff = Date.now() / 1000 - LIVE_SECONDS;
        let maximum = live.since;
        for (const name of names) {
          if (!state.observed.has(name)) continue;
          if (!Object.prototype.hasOwnProperty.call(payload, name) || !Array.isArray(payload[name])) continue;
          const points = live.cache.get(name) || [];
          let last = live.lastTs.has(name) ? live.lastTs.get(name) : -Infinity;
          for (const point of payload[name]) {
            if (!Array.isArray(point) || point.length !== 2 || typeof point[0] !== "number" || !Number.isFinite(point[0])) continue;
            if (maximum === null || point[0] > maximum) maximum = point[0];
            if (point[0] >= cutoff && point[0] > (live.lastTs.has(name) ? live.lastTs.get(name) : -Infinity)) {
              points.push([point[0], point[1]]);
              last = Math.max(last, point[0]);
            }
          }
          points.sort((a, b) => a[0] - b[0]);
          live.cache.set(name, points);
          if (last > -Infinity) live.lastTs.set(name, last);
        }
        // 请求期间观测集合变化时，保留重新全量读取的标记。
        if (live.namesKey === key) live.since = maximum;
      } catch {
        // 请求失败保留仍在时间窗口内的数据，下一个周期继续尝试。
      } finally {
        clearTimeout(timeout);
        if (live.controller === controller) live.controller = null;
      }
    }

    function pruneCache() {
      const cutoff = Date.now() / 1000 - LIVE_SECONDS;
      for (const [name, points] of live.cache) {
        if (!state.observed.has(name)) { live.cache.delete(name); continue; }
        const recent = points.filter(point => point[0] >= cutoff);
        if (recent.length) live.cache.set(name, recent);
        else live.cache.delete(name);
      }
    }

    function updateStatus() {
      const status = document.getElementById("status");
      const messages = [];
      if (state.moduleError) messages.push("模块说明：" + state.moduleError);
      if (state.namesError) messages.push("数据连接：" + state.namesError);
      const ready = state.text !== null && state.namesLoaded;
      const message = messages.length ? messages.join(" · ") : state.text === null ? "正在读取模块说明…" : state.namesLoaded ? "已连接" : "正在连接数据…";
      status.className = "status " + (messages.length ? "warning" : ready ? "ok" : "pending");
      document.getElementById("status-text").textContent = message;
      status.title = messages.length ? message : ready ? "模块已同步 · 数据连接正常" : message;
    }

    async function request(path, asJson) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch(path, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(response.status === 404 ? "文件或接口不存在（404）" : "HTTP " + response.status);
        return await (asJson ? response.json() : response.text());
      } finally { clearTimeout(timeout); }
    }

    function errorMessage(error) {
      return error.name === "AbortError" ? "请求超时，将自动重试" : error.message || "请求失败，将自动重试";
    }

    async function loadModules() {
      if (state.modulePending) return;
      state.modulePending = true;
      try {
        const text = await request("/module.md", false);
        state.moduleError = "";
        if (text !== state.text) {
          const first = state.text === null;
          state.model = parseMarkdown(text);
          state.text = text;
          // 热更新时保留当前层级与已选观测；仅在模块被删除后退回仍存在的上层。
          while (state.level && !state.model.modules.has(state.level)) state.level = parentId(state.level);
          document.title = state.model.title + " · 模块与数据流";
          render(first ? "fade" : "");
          rebuildCards();
        }
      } catch (error) {
        state.moduleError = errorMessage(error);
        if (state.text === null) render();
      } finally {
        state.modulePending = false;
        updateStatus();
      }
    }

    async function loadNames() {
      if (state.namesPending) return;
      state.namesPending = true;
      try {
        const names = await request("/names", true);
        if (!names || typeof names !== "object" || Array.isArray(names)) throw new Error("返回格式不正确");
        state.names = new Map(Object.entries(names).filter(([, timestamp]) => typeof timestamp === "number" && Number.isFinite(timestamp)));
        state.namesLoaded = true;
        state.namesError = "";
        updateEdges();
      } catch (error) {
        state.namesError = errorMessage(error);
      } finally {
        state.namesPending = false;
        updateStatus();
      }
    }

    document.querySelectorAll(".filters input").forEach(input => input.addEventListener("change", () => {
      state.types = new Set([...document.querySelectorAll(".filters input:checked")].map(item => item.value));
      render("fade");
    }));
    document.addEventListener("pointerdown", event => {
      if (!state.popover || popover.contains(event.target)) return;
      if (event.target.closest?.(".node, .edge")) return;
      closePopover();
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape") closePopover(); });
    graph.addEventListener("scroll", positionPopover, { passive: true });
    window.addEventListener("resize", () => { fitGraph(); renderCards(); });
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(() => fitGraph()).observe(graph);
      new ResizeObserver(() => scheduleCards()).observe(cardsEl);
    }

    updatePause();
    render();
    loadModules();
    loadNames();
    setInterval(loadModules, 3000);
    setInterval(() => { updateEdges(); loadNames(); }, 1000);
    setInterval(() => {
      pruneCache();
      pollData();
      if (!state.paused) renderCards();
    }, 200);
  </script>
</body>
</html>
