<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>实时监测</title>
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="模块层级"></nav>
    <div class="topbar-right">
      <div id="status" class="status pending" role="status" aria-live="polite">
        <i class="status-dot" aria-hidden="true"></i>
        <span id="status-text" class="status-text">正在连接…</span>
      </div>
      <div class="metrics" aria-hidden="true">
        <span class="metric"><span class="metric-label">收包</span><span id="metric-rate" class="metric-value">—</span></span>
        <span class="metric"><span class="metric-label">最近</span><span id="metric-age" class="metric-value">—</span></span>
      </div>
      <div class="top-actions">
        <button id="toggle-sidebar" class="top-action" type="button" aria-expanded="false" hidden>
          <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 11 V3 M5 11 V6 M8 11 V8 M11 11 V4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span class="button-text">监测</span>
        </button>
        <button id="pause" class="top-action" type="button" aria-pressed="false" disabled></button>
        <button id="clear-observed" class="top-action" type="button" title="清空所有观测" aria-label="清空所有观测" disabled>
          <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 4 H11 M5.5 4 V2.8 H8.5 V4 M4.2 4 L4.8 12 H9.2 L9.8 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="button-text">清空</span>
        </button>
        <button id="theme" class="top-action icon-only" type="button" title="切换主题" aria-label="切换主题"></button>
      </div>
    </div>
  </header>

  <div class="main">
    <section id="canvas" class="canvas" aria-label="模块与数据流监测图">
      <div id="graph" class="graph"></div>
      <div class="zoom" role="group" aria-label="缩放">
        <button id="zoom-out" class="zoom-button" type="button" title="缩小" aria-label="缩小">−</button>
        <span id="zoom-value" class="zoom-value">—</span>
        <button id="zoom-in" class="zoom-button" type="button" title="放大" aria-label="放大">+</button>
        <button id="zoom-fit" class="zoom-button" type="button" title="适应窗口（F）">适应</button>
      </div>
      <div id="popover" class="popover" hidden></div>
    </section>

    <aside id="sidebar" class="sidebar" aria-label="实时监测" aria-hidden="true">
      <div class="side-inner">
        <div class="side-head">
          <h2 class="side-title">实时监测</h2>
          <span id="observe-count" class="side-sub"></span>
          <div class="side-actions">
            <div class="segmented" role="group" aria-label="时间窗口">
              <button type="button" data-window="10" aria-pressed="true">10s</button>
              <button type="button" data-window="30" aria-pressed="false">30s</button>
            </div>
            <button id="close-sidebar" class="icon-button side-close" type="button" title="收起监测栏" aria-label="收起监测栏">
              <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 3.5 L9 7 L5.5 10.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div id="side-note" class="side-note"></div>
        <div id="cards" class="cards"></div>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <span class="key"><i class="key-pipe"></i><i class="key-pipe thick"></i>越粗数据越多</span>
    <span class="key"><i class="key-pipe live"></i>流动表示 2 秒内有数据</span>
    <span class="key"><i class="key-pipe wire"></i>彩色为选中的数据</span>
    <span class="foot-hint">点击管道选择数据 · ⌘/Ctrl + 滚轮缩放</span>
    <button id="diagnostics-button" class="diagnostics-button" type="button" title="运行状态与诊断">
      诊断 <span id="diagnostics-count" class="badge"></span>
    </button>
  </footer>

  <dialog id="diagnostics-dialog" class="dialog" aria-labelledby="diagnostics-title">
    <div class="dialog-inner">
      <header class="dialog-head">
        <h2 id="diagnostics-title">运行诊断</h2>
        <button class="dialog-close icon-button" type="button" title="关闭" aria-label="关闭">
          <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 3.5 L10.5 10.5 M10.5 3.5 L3.5 10.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div id="diagnostics-body" class="dialog-body"></div>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
